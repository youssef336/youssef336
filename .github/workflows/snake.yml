name: Profile graph and badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Badge data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          followers=$(gh api "users/$OWNER" --jq .followers)
          stars=$(gh api --paginate "users/$OWNER/repos?type=owner&per_page=100" \
            --jq '.[].stargazers_count' | awk '{s+=$1} END {print s+0}')
          badge() {
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"02569B"}' "$1" "$2"
          }
          badge followers "$followers" > dist/followers.json
          badge Stars "$stars" > dist/stars.json

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
